# lab/scope.toml
#
# STRUCTURAL BOUNDARY — not documentation.
#
# `host` derives every capability grant issued to attacker/defender sandbox
# instances directly from the fields declared below. Nothing outside this
# declaration is reachable by a lab agent, regardless of what it is
# instructed or attempts to reason about. See CONTEXT.md, section 3
# ("Lab scope lock") — this file is that lock's contents, not a description
# of it.
#
# This scope is intentionally container-local: no cloud account, no VPC,
# no real network egress, and no target outside this repo's own
# lab/target/ directory. `environment.account`/`environment.network` are
# omitted entirely — genuinely absent, not defaulted to a fake value, per
# host/src/scope.rs's Option<Account>/Option<Network> fields.
#
# Path containment is real and enforced: `host::evaluate` checks any
# attempted path against the declared `[[environment.targets]]` entries
# below (canonicalized, symlink-safe, via the same primitive `gate-pipeline`
# uses for the harness gate) and denies anything that resolves outside them
# — see host/src/broker.rs. What's still NOT real: `research_agent::Technique`
# carries no per-technique path, so `lab-agents::attempt_all` checks every
# attempt against this scope's declared target as a whole, not a specific
# per-technique file; and there is still no wasmtime/WASI-P2 execution
# engine, so a granted, path-clean technique still doesn't actually run —
# see lab-agents' attacker.rs doc comment for that separate, disclosed gap.

[environment]
# Human-readable name for this lab environment, used in audit log entries.
name = "codespace-local-lab"

# No [environment.account] or [environment.network] -- this lab has no
# cloud account and no VPC. Both are genuinely absent, not faked.

# The only real target: a directory inside this Codespace's own ephemeral
# container filesystem, not an external resource of any kind. Real
# containment: host::evaluate denies any attempted path outside this
# directory (see host/src/broker.rs's local-directory target check).
[[environment.targets]]
id = "lab-target-local"
type = "local-directory"
identifier = "lab/target"
description = "The Codespace's own ephemeral container filesystem, scoped to this one repo-local directory. Not a cloud resource, not shared with any other environment, destroyed whenever this Codespace is."

# -----------------------------------------------------------------------------
# Allowed technique categories
# -----------------------------------------------------------------------------
# Technique categories the research-agent queue may draw on and lab-agents may
# execute within this scope. An empty or absent category is NOT in scope.

[techniques]
allowed_categories = [
    "T1059", # Command and Scripting Interpreter -- already ingested from
             # Atomic Red Team, genuinely testable against a local
             # filesystem/process target, no cloud resource required.
]

# Explicit source allowlist for technique ingestion (see CONTEXT.md, section 4).
# research-agent must reject anything not drawn from these sources.
allowed_sources = [
    "atomic-red-team",
]

# -----------------------------------------------------------------------------
# Explicit exclusions
# -----------------------------------------------------------------------------
# Anything listed here is excluded even if it would otherwise match an
# allowed category or fall within the account/network boundary above.
# Exclusions always take precedence over allowances.

[exclusions]
technique_categories = [
    "T1078", # Valid Accounts -- needs a real account/IAM system to mean
             # anything; excluded on principle, not just "not yet added".
    "T1499", # Endpoint Denial of Service -- unsafe regardless of
             # environment, excluded on principle.
]
notes = "Only lab/target/ is in scope for any file or command operation -- enforced structurally by host::evaluate's path check, not just documented here. No real network egress beyond what the Codespace itself already needs (crates.io, github.com) is part of this lab's granted capabilities. Any technique category that would require real cloud resources (IAM, account services, VPC-level controls, etc.) to mean anything stays excluded regardless of whether it's explicitly listed above -- this scope only ever grants what a bare, disposable container can honestly provide."

# No [validity] table -- omitted entirely, not commented out. Per
# host/src/scope.rs's ScopeConfig::is_temporally_valid, an absent
# [validity] table deserializes to None, meaning "always valid, no time
# restriction" -- confirmed in code, not assumed.
