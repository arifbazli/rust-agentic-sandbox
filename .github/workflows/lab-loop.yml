name: Scheduled lab loop

# Runs the attack/defend lab end to end on a schedule: research-agent
# ingest -> lab-agents attacker -> lab-agents defender -> verifier verify.
# This is a scheduled report, not a PR gate -- do NOT add it to branch
# protection's required status checks.

on:
  schedule:
    # Daily, off the top of the hour to avoid GitHub's peak scheduling
    # load. This workflow's ingest step only ever queues real,
    # ingested-from-source techniques (currently just T1059) -- the
    # synthetic proving technique (research_agent::synthetic) that the
    # real wasmtime/WASI execution engine actually serves deliberately
    # never goes through real ingestion, and nothing here seeds it. So
    # every scheduled run is still expected to end in an honest `Blocked`
    # verdict for T1059 (see README's "Known gaps"), not because no
    # execution engine exists at all anymore, but because this specific
    # workflow never exercises the one technique that has one. The step
    # summary logic below is generic (it tees each binary's real stdout,
    # it never parses or branches on the verdict text), so it would
    # render a Detected/Missed result correctly if this workflow's scope
    # ever grew to cover one -- this schedule exists to catch regressions
    # (a broken upstream fetch, a dependency bump that breaks the chain),
    # not to surface new findings. Daily is frequent enough to catch a
    # break within a day without generating hourly-repeated noise.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Explicit (rather than relying on the platform default) because
    # only `shell: bash` enables pipefail; without it, a failing
    # `cargo run` piped into `tee` would silently report success.
    shell: bash

jobs:
  lab-loop:
    name: research-agent -> attacker -> defender -> verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wasm32-wasip1 IS required here: lab-agents gained its own
      # build.rs/guest module (crates/lab-agents/guest/execute_marker_write.rs,
      # compiled to wasm32-wasip1) for the synthetic proving technique's
      # real execution engine -- independent of gate-pipeline's own WASI
      # guest, but needing the same target. This comment used to say the
      # opposite; that was true when this workflow was first written, not
      # after lab-agents gained that build script.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Prepare audit store directory
        # .audit/ is fully gitignored and nothing creates it -- redb's
        # Database::create opens/creates the *file* but, like any
        # standard file-open call, does not create missing parent
        # directories. A fresh checkout has no .audit/ at all, unlike a
        # long-lived Codespace where this happened to exist already.
        run: mkdir -p .audit

      - name: 1. research-agent -- ingest
        run: |
          {
            echo "## 1. research-agent -- ingest"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo run -p research-agent --bin ingest 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 2. lab-agents -- attacker
        run: |
          {
            echo "## 2. lab-agents -- attacker"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo run -p lab-agents --bin attacker 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 3. lab-agents -- defender
        run: |
          {
            echo "## 3. lab-agents -- defender"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo run -p lab-agents --bin defender 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 4. verifier -- verify
        run: |
          {
            echo "## 4. verifier -- verify"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo run -p verifier --bin verify 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit store
        # always(): upload whatever was produced even if a later step in
        # the chain failed, so a broken run is still inspectable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-loop-audit-store-${{ github.run_id }}
          path: .audit/store.redb
          retention-days: 30
          if-no-files-found: warn
